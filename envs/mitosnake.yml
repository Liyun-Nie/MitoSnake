  - snakemake = 8.30.0
  - jinja2
  - matplotlib
  - graphviz
  - pygments
  - mamba
  - pandas
  - numpy
  - seaborn
  - scikit-learn
  - pyyaml
  - tabulate
  - biopython
  - seqkit
  - seqtk
  - minimap2
  - samtools
  - fastp
  - spades
  - flye
  - bowtie2
  - pilon